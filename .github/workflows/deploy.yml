name: Deploy to Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /srv/app/RSTPMS
            git pull origin main
            source ~/.nvm/nvm.sh
            pnpm install
            pnpm build
            pnpm migrate
            pnpm seed
            pm2 restart rstpms
            pm2 save
